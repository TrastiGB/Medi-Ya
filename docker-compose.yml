services:
  db:
    image: postgres
    container_name: mediya-db
    restart: always
    environment:
      POSTGRES_DB: mediya
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: mediya-backend
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - .env

volumes:
  postgres-data:
